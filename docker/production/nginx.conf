# nginx in the `web` image: serves public/ and passes PHP to the app container.
# TLS is terminated by Caddy in front (deploy/prod/Caddyfile); this server only
# listens on the private compose network.
#
# No security headers here on purpose: the application sets Content-Security-Policy
# (nonce-based), Strict-Transport-Security, X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy, Permissions-Policy and X-Permitted-Cross-Domain-Policies itself
# (checked against the built image, 2026-09-24). A second CSP from nginx would be
# enforced in addition to the app's and break what the app's policy allows.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Resolve the app container through Docker's DNS on every connection: the app
    # containers are recreated on each deploy or .env change and get a new address,
    # and nginx would otherwise keep the one it saw at start-up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:9000;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass $app_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Immutable, hashed Vite assets
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
