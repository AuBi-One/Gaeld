; Gäld production pool (overrides www.conf; upstream's docker/php/zz-gaeld-pool.conf sized up)
; The container runs as uid 82 (www-data) via docker-compose.yml, so php-fpm's master is
; not root and the user/group directives of www.conf are ignored (a harmless notice).
[www]
listen = 9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
listen.backlog = 1024
request_terminate_timeout = 120s
; Health check used by the image HEALTHCHECK and docker compose
ping.path = /ping
ping.response = pong
pm.status_path = /status
; Worker stdout/stderr to the container log
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
