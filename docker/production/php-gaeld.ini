; Gäld production overrides (loaded after php.ini-production and opcache.ini)
expose_php = Off
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 20M
post_max_size = 20M
; Sessions live in Redis; nothing is written under /tmp
session.save_handler = files
; Laravel sets the PHP timezone to config('app.timezone') at boot, which is UTC in this
; fork (no config/app.php overrides the framework default) — see PROD-SETUP.md P12.
date.timezone = UTC
; Errors go to the container log (docker logs), never to the browser
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
