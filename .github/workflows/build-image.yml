# Builds the production images of the AuBi-One fork and pushes them to GHCR.
# Lives in the fork at .github/workflows/build-image.yml (copied from gaeld-ops/deploy/fork).
#
# Triggers
#   - a release tag  vX.Y.Z-aubi.N  (upstream version + our build number)  -> images tagged vX.Y.Z-aubi.N
#   - a push to `aubi`                                                       -> images tagged edge (+ sha-…)
#   - manual (workflow_dispatch)
#
# Images (two targets of docker/production/Dockerfile):
#   ghcr.io/aubi-one/gaeld       php-fpm + application
#   ghcr.io/aubi-one/gaeld-web   nginx + public/
#
# The fork's ci.yml runs on the same tag (tests, Pint, PHPStan). A tag is deployable
# only when BOTH workflows are green; deploy.sh does not check this for you.
name: Build production image

on:
  push:
    branches: [aubi]
    tags: ['v*-aubi.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Same as the fork's ci.yml: run JavaScript actions on Node 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and push (app + web)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release tags must point at a commit on `aubi`
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin aubi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/aubi; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on branch aubi"; exit 1
          fi

      - name: Image names (GHCR wants lowercase)
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "app=${REGISTRY}/${owner}/gaeld" >> "$GITHUB_OUTPUT"
          echo "web=${REGISTRY}/${owner}/gaeld-web" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for the app image
        id: meta_app
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.app }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/aubi' }}

      - name: Tags for the web image
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.web }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/aubi' }}

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          build-args: |
            GAELD_VERSION=${{ steps.names.outputs.version }}
            GAELD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          build-args: |
            GAELD_VERSION=${{ steps.names.outputs.version }}
            GAELD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          provenance: false

      - name: Smoke test the pushed images
        env:
          APP: ${{ steps.names.outputs.app }}
          WEB: ${{ steps.names.outputs.web }}
        run: |
          set -eux
          # The sha-<short> tag exists for every trigger (tag, push to aubi, manual run on any branch)
          TAG="sha-${GITHUB_SHA::7}"
          docker pull "$APP:$TAG"
          docker pull "$WEB:$TAG"
          # Required extensions and the plugins are in the image
          docker run --rm --entrypoint sh "$APP:$TAG" -c 'php -m | grep -qx redis && php -m | grep -qx pdo_pgsql'
          docker run --rm --entrypoint sh "$APP:$TAG" -c 'test -f public/build/manifest.json && ls plugins | grep -qx expense-claims && ls plugins | grep -qx offers && ls plugins | grep -qx document-layouts && ! test -d plugins/aubi-migration'
          # Plugin pages made it into the Vite manifest
          docker run --rm --entrypoint sh "$APP:$TAG" -c 'grep -q "expense-claims" public/build/manifest.json'
          # Boots with a throwaway key (no database needed for --version)
          docker run --rm -e APP_KEY="base64:$(openssl rand -base64 32)" -e GAELD_SKIP_CACHE=1 "$APP:$TAG" php artisan --version
          # nginx resolves the `app` upstream at start: give it a fake one for the syntax check
          docker run --rm --add-host app:127.0.0.1 "$WEB:$TAG" nginx -t

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo '```'
            echo "${{ steps.meta_app.outputs.tags }}"
            echo "${{ steps.meta_web.outputs.tags }}"
            echo '```'
            echo "Deploy with: \`sudo /srv/gaeld-prod/deploy.sh ${{ steps.names.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
